name: Deploy music.qianzhi.pw

on:
  push:
    branches:
      - main
      - feat/music-vendored-open-source-modules
      - feat/music-first-run-login-tour
  workflow_dispatch:
    inputs:
      target:
        description: 'Publish to isolated workers.dev preview or the production custom domain'
        type: choice
        options:
          - preview
          - production
        default: preview
        required: true

# Main branch pushes deploy production; feature-branch pushes deploy the isolated preview.
# Keep production and preview deployments in separate concurrency groups.
concurrency:
  group: music-deploy-${{ github.ref }}-${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')) && 'production' || 'preview' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required deployment secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QQ_SECRET: ${{ secrets.QQ_SESSION_SECRET }}
          QZNB_ANON_KEY: ${{ secrets.QZNB_SUPABASE_ANON_KEY }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
          test -n "$QQ_SECRET" || { echo "::error::Missing QQ_SESSION_SECRET repository secret"; exit 1; }
          test -n "$QZNB_ANON_KEY" || { echo "::error::Missing QZNB_SUPABASE_ANON_KEY repository secret"; exit 1; }

      - name: Select Worker target (main is production; feature branch is preview)
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "WRANGLER_CONFIG=wrangler.jsonc" >> "$GITHUB_ENV"
            echo "Selected production Worker; music.qianzhi.pw will be activated."
          elif [ "$TARGET" = "production" ]; then
            echo "WRANGLER_CONFIG=wrangler.jsonc" >> "$GITHUB_ENV"
            echo "Selected production Worker; music.qianzhi.pw will be activated."
          elif [ "$TARGET" = "preview" ] || [ -z "$TARGET" ]; then
            echo "WRANGLER_CONFIG=wrangler.preview.jsonc" >> "$GITHUB_ENV"
            echo "Selected isolated workers.dev preview Worker."
          else
            echo "::error::Unsupported deployment target: $TARGET"
            exit 1
          fi

      - name: Checkout including pinned Folia source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: music/folia/package-lock.json

      - name: Apply maintained Folia mobile gesture overlay
        run: node music/scripts/apply-folia-mobile-gestures.mjs

      - name: Apply optional Qianzhi account integration
        run: node music/scripts/apply-qianzhi-account.mjs

      - name: Apply first-run music provider login tour
        run: node music/scripts/apply-music-login-tour.mjs

      - name: Apply NetEase cross-device sync overlay
        run: node music/scripts/apply-folia-netease-sync.mjs

      - name: Test NetEase Worker security helpers
        run: node music/scripts/test-netease-security.mjs

      - name: Install Folia dependencies
        working-directory: music/folia
        run: npm ci

      - name: Install pinned Supabase browser client for the account overlay
        working-directory: music/folia
        run: npm install --no-save --package-lock=false --ignore-scripts @supabase/supabase-js@2.119.0

      - name: Apply Folia NetEase API Workers adapter
        run: node music/scripts/apply-folia-netease-workers.mjs

      - name: Apply free music catalog provider and license UI
        run: node music/scripts/apply-folia-free-catalog.mjs

      - name: Apply Folia mobile camera and empty-wall recovery
        run: node music/scripts/apply-folia-mobile-layout.mjs

      - name: Apply Qianzhi player polish (softer background dithering)
        run: node music/scripts/apply-folia-player-polish.mjs

      - name: Apply Qianzhi music brand label
        run: node music/scripts/apply-folia-qianzhi-label.mjs

      - name: Apply qianzhi product branding
        run: node music/scripts/apply-qianzhi-branding.mjs

      - name: Apply adaptive Qianzhi mobile performance profile
        run: node music/scripts/apply-qianzhi-performance.mjs

      - name: Typecheck Folia
        working-directory: music/folia
        run: npm run typecheck

      - name: Test Folia mobile camera and empty-wall recovery
        working-directory: music/folia
        run: npm run test:unit -- test/unit/library/bravais/bravaisMobileRecovery.test.ts

      - name: Test Lark mobile swipe integration
        working-directory: music/folia
        run: npm run test:unit -- test/unit/components/playerSwipe.test.ts

      - name: Test Qianzhi account integration
        working-directory: music/folia
        run: npm run test:unit -- test/unit/qianzhiAccount/loginMethod.test.ts

      - name: Test NetEase sync client
        working-directory: music/folia
        run: npm run test:unit -- test/unit/qianzhiNeteaseSync/syncClient.test.ts

      - name: Test adaptive Qianzhi performance profile
        working-directory: music/folia
        run: npm run test:unit -- test/unit/utils/qianzhiPerformance.test.ts

      - name: Build Folia Web + Worker
        working-directory: music/folia
        env:
          VITE_QQ_API_BASE: /api/qq
          VITE_NETEASE_API_BASE: /api/netease
          VITE_QZNB_SUPABASE_URL: https://ldypnxxxgscibopgiaso.supabase.co
          VITE_QZNB_SUPABASE_ANON_KEY: ${{ secrets.QZNB_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Create the first Worker deployment
        working-directory: music
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.120.0 deploy --config "$WRANGLER_CONFIG"

      - name: Store QQ login session secret
        working-directory: music
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QQ_SESSION_SECRET: ${{ secrets.QQ_SESSION_SECRET }}
        run: |
          printf '%s' "$QQ_SESSION_SECRET" | npx --yes wrangler@4.120.0 secret put QQ_SESSION_SECRET --config "$WRANGLER_CONFIG"

      - name: Publish Worker with QQ login enabled
        working-directory: music
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.120.0 deploy --config "$WRANGLER_CONFIG"
