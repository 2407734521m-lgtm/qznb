<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>动态签名 · 名字写给你看</title>
<style>
  :root{ --pink:#ff7eb6; --gold:#f5c86b; --ink:#f4eefc; --muted:#a99bc4; --card:#1d1233; --line:#33245a; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{ background:#0d0716; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; padding:14px 14px 40px; }
  header{ text-align:center; padding:10px 0 14px; }
  header h1{ font-size:24px; letter-spacing:2px; background:linear-gradient(90deg,#ff9ec7,#f5c86b,#c99aff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p{ color:var(--muted); font-size:12.5px; margin-top:4px; }
  main{ max-width:720px; margin:0 auto; }

  /* ---------- 舞台 ---------- */
  #stageWrap{ border-radius:20px; overflow:hidden; border:1px solid var(--line); box-shadow:0 12px 40px rgba(0,0,0,.5); }
  #stage{ position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; background:linear-gradient(160deg,#160a2e,#0a0518); transition:background .4s; }
  #stage.ratio-916{ aspect-ratio:9/16; }
  #stage.ratio-11{ aspect-ratio:1/1; }
  #stars{ position:absolute; inset:0; width:100%; height:100%; }
  #names{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2%; padding:6% 5%; transition:opacity 1s ease, transform 1s ease; }
  #names.fading{ opacity:0; transform:scale(.94); }
  .nameRow{ position:relative; width:94%; }
  .vara{ width:100%; }
  .vara svg{ width:100%; height:auto; display:block; overflow:visible; }
  .deco{ position:absolute; right:2%; top:-14px; width:44px; height:44px; opacity:0; transform:scale(.4) rotate(-20deg); transition:all .5s cubic-bezier(.34,1.56,.64,1); pointer-events:none; filter:drop-shadow(0 2px 6px rgba(0,0,0,.45)); }
  .deco.show{ opacity:1; transform:scale(1) rotate(0deg); animation:bob 2.4s ease-in-out .5s infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-3deg);} 50%{ transform:translateY(-6px) rotate(4deg);} }
  #divider{ opacity:0; transform:scale(.5); transition:all .5s ease; color:var(--pink); font-size:26px; line-height:1; }
  #divider.show{ opacity:1; transform:scale(1); }
  #confetti{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #stageHint{ position:absolute; left:0; right:0; bottom:10px; text-align:center; color:rgba(255,255,255,.55); font-size:12px; pointer-events:none; transition:opacity .5s; }
  #stageHint.hide{ opacity:0; }
  #doneTag{ position:absolute; left:0; right:0; top:12px; text-align:center; font-size:13px; letter-spacing:2px; color:var(--gold); opacity:0; transition:opacity .6s; pointer-events:none; }
  #doneTag.show{ opacity:1; }

  /* ---------- 控制面板 ---------- */
  .panel{ margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; }
  .panel h2{ font-size:14px; margin-bottom:10px; color:#e8ddff; }
  .panel h2 span{ color:var(--muted); font-weight:400; font-size:12px; }
  .nameCard{ background:#160d29; border:1px solid #2b1d4d; border-radius:14px; padding:12px; margin-bottom:10px; }
  .nameCard .row{ display:flex; gap:8px; align-items:center; margin-bottom:10px; }
  .nameCard .row:last-child{ margin-bottom:0; }
  .tag{ flex:0 0 auto; font-size:12px; color:var(--gold); border:1px solid #5a4485; border-radius:999px; padding:3px 9px; }
  input[type=text]{ flex:1; min-width:0; background:#0d0716; border:1px solid #3d2b66; color:#fff; border-radius:10px; padding:9px 11px; font-size:16px; outline:none; }
  input[type=text]:focus{ border-color:var(--pink); }
  select{ background:#0d0716; color:#fff; border:1px solid #3d2b66; border-radius:10px; padding:8px 6px; font-size:13px; outline:none; max-width:118px; }
  label{ font-size:12px; color:var(--muted); flex:0 0 auto; }
  input[type=range]{ flex:1; accent-color:var(--pink); min-width:60px; }
  .swatches{ display:flex; gap:7px; flex-wrap:wrap; }
  .sw{ width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .sw.on{ border-color:#fff; transform:scale(1.15); }
  .sw.light{ border-color:rgba(0,0,0,.25); }
  .decoBtns{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{ background:#241739; border:1px solid #3d2b66; color:#d9cdf2; border-radius:999px; padding:6px 11px; font-size:12.5px; cursor:pointer; }
  .chip.on{ background:var(--pink); border-color:var(--pink); color:#2a0a1c; font-weight:700; }
  .seg{ display:flex; gap:6px; }
  .seg .chip{ flex:1; text-align:center; }

  .actions{ display:flex; gap:8px; margin-top:12px; }
  .btn{ flex:1; border:none; border-radius:12px; padding:13px 8px; font-size:15px; font-weight:700; cursor:pointer; }
  .btnPlay{ background:linear-gradient(135deg,#ff7eb6,#ff5a8a); color:#fff; box-shadow:0 6px 18px rgba(255,90,138,.4); }
  .btnGhost{ background:#241739; color:#e8ddff; border:1px solid #3d2b66; }
  .btnExport{ background:linear-gradient(135deg,#f5c86b,#e8a93d); color:#3a2503; box-shadow:0 6px 18px rgba(245,200,107,.3); }
  .btn:disabled{ opacity:.45; cursor:default; box-shadow:none; }
  .status{ margin-top:10px; font-size:12.5px; color:var(--muted); text-align:center; min-height:18px; }
  .status b{ color:var(--gold); }
  .note{ margin-top:12px; font-size:12px; line-height:1.7; color:var(--muted); }
  .note b{ color:#d9cdf2; }
</style>
</head>
<body>
<header>
  <h1>✦ 动态签名 ✦</h1>
  <p>写下两个名字，看它们一笔一笔为彼此写出来</p>
</header>
<main>
  <div id="stageWrap">
    <div id="stage">
      <canvas id="stars"></canvas>
      <div id="names">
        <div class="nameRow"><div id="vara1" class="vara"></div><div class="deco" id="deco1"></div></div>
        <div id="divider">♥</div>
        <div class="nameRow"><div id="vara2" class="vara"></div><div class="deco" id="deco2"></div></div>
      </div>
      <canvas id="confetti"></canvas>
      <div id="doneTag">✦ 已完成 · 点 ▶ 再看一遍 ✦</div>
      <div id="stageHint">点下面的 ▶ 播放，看名字一笔一笔写出来</div>
    </div>
  </div>

  <section class="panel">
    <h2>名字一 <span>· 上面那行</span></h2>
    <div class="nameCard" id="card1">
      <div class="row"><span class="tag">名字</span><input type="text" id="name1" value="Taiyang" maxlength="14" placeholder="输入英文拼音名字"><select id="font1"></select></div>
      <div class="row"><label>颜色</label><div class="swatches" id="color1"></div></div>
      <div class="row"><label>大小</label><input type="range" id="size1" min="0.6" max="1.8" step="0.1" value="1"><label>粗细</label><input type="range" id="thick1" min="0.5" max="2" step="0.1" value="1"></div>
      <div class="row"><label>装饰</label><div class="decoBtns" id="decoBtns1"></div></div>
    </div>
    <h2>名字二 <span>· 下面那行</span></h2>
    <div class="nameCard" id="card2">
      <div class="row"><span class="tag">名字</span><input type="text" id="name2" value="yueliang" maxlength="14" placeholder="输入英文拼音名字"><select id="font2"></select></div>
      <div class="row"><label>颜色</label><div class="swatches" id="color2"></div></div>
      <div class="row"><label>大小</label><input type="range" id="size2" min="0.6" max="1.8" step="0.1" value="1"><label>粗细</label><input type="range" id="thick2" min="0.5" max="2" step="0.1" value="1"></div>
      <div class="row"><label>装饰</label><div class="decoBtns" id="decoBtns2"></div></div>
    </div>

    <h2>画面</h2>
    <div class="nameCard">
      <div class="row"><label>比例</label><div class="seg" style="flex:1">
        <button class="chip on" data-ratio="16:9">16:9 横屏</button>
        <button class="chip" data-ratio="9:16">9:16 竖屏</button>
        <button class="chip" data-ratio="1:1">1:1 方形</button>
      </div></div>
      <div class="row"><label>背景</label><div class="swatches" id="bgSwatches"></div></div>
      <div class="row"><label>音乐</label><button class="chip" id="musicBtn">🎵 轻音乐：关</button>
      <label>时长</label><select id="durationSel"><option value="auto">自动（写完+收尾）</option><option value="6">6 秒</option><option value="10">10 秒</option></select></div>
    </div>

    <div class="actions">
      <button class="btn btnPlay" id="playBtn">▶ 播放签名</button>
      <button class="btn btnGhost" id="replayBtn">↻ 再看一遍</button>
    </div>
    <div class="actions">
      <button class="btn btnExport" id="exportBtn">⬇ 导出视频</button>
    </div>
    <div class="status" id="status"></div>
    <div class="note">
      <b>玩法：</b>改好两个名字和颜色，点 ▶ 播放，两个名字会一起一笔一笔写出来，写完纸屑一炸、慢慢淡出。想换效果直接改，改完会自动重播一遍。<br>
      <b>注意：</b>手写字体只支持英文字母、数字和标点，中文名字请先用拼音（比如 Taiyang）；导出的是 <b>WebM 视频</b>，手机浏览器录出来就是这个格式，大多数播放器都能直接看，MP4 需要转码所以这次没做。
    </div>
  </section>
</main>

<script>
(function(){

/* ================= 基础数据 ================= */
var FONTS_LABEL = { Parisienne:"签名连笔", SatisfySL:"随性手写", PacificoSLO:"圆润可爱", ShadowsIntoLight:"清秀细笔" };

  {n:"纯白", c1:"#ffffff", c2:"#efefef", stars:false}
];
var DECOS = {
  none:  {n:"无", svg:""},
  cat:   {n:"🐱 猫耳", svg:'<svg viewBox="0 0 100 100"><path d="M12 62 L22 12 L50 34 L78 12 L88 62 Q88 78 50 78 Q12 78 12 62Z" fill="#ff9ec7" stroke="#e7548a" stroke-width="3"/><path d="M26 52 L30 26 L44 38Z" fill="#ffd3e6"/><path d="M74 52 L70 26 L56 38Z" fill="#ffd3e6"/></svg>'},
  paw:   {n:"🐾 爪印", svg:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="66" rx="24" ry="18" fill="#ff9ec7"/><ellipse cx="22" cy="42" rx="9" ry="12" fill="#ff9ec7" transform="rotate(-18 22 42)"/><ellipse cx="40" cy="32" rx="9" ry="13" fill="#ff9ec7"/><ellipse cx="60" cy="32" rx="9" ry="13" fill="#ff9ec7"/><ellipse cx="78" cy="42" rx="9" ry="12" fill="#ff9ec7" transform="rotate(18 78 42)"/></svg>'},
  sun:   {n:"☀️ 太阳", svg:'<svg viewBox="0 0 100 100"><g stroke="#f5c86b" stroke-width="6" stroke-linecap="round"><line x1="50" y1="4" x2="50" y2="18"/><line x1="50" y1="82" x2="50" y2="96"/><line x1="4" y1="50" x2="18" y2="50"/><line x1="82" y1="50" x2="96" y2="50"/><line x1="18" y1="18" x2="28" y2="28"/><line x1="72" y1="72" x2="82" y2="82"/><line x1="82" y1="18" x2="72" y2="28"/><line x1="28" y1="72" x2="18" y2="82"/></g><circle cx="50" cy="50" r="22" fill="#ffd94d" stroke="#e8a93d" stroke-width="3"/></svg>'},
  heart: {n:"♥ 爱心", svg:'<svg viewBox="0 0 100 100"><path d="M50 86 C20 62 8 44 8 30 C8 16 20 8 30 8 C40 8 47 14 50 22 C53 14 60 8 70 8 C80 8 92 16 92 30 C92 44 80 62 50 86Z" fill="#ff5a8a" stroke="#d6336c" stroke-width="3"/></svg>'},
  star:  {n:"⭐ 星星", svg:'<svg viewBox="0 0 100 100"><path d="M50 6 L61 36 L94 36 L67 56 L77 90 L50 70 L23 90 L33 56 L6 36 L39 36Z" fill="#ffd94d" stroke="#e8a93d" stroke-width="3" stroke-linejoin="round"/></svg>'},
  crown: {n:"👑 皇冠", svg:'<svg viewBox="0 0 100 100"><path d="M12 74 L8 26 L30 46 L50 16 L70 46 L92 26 L88 74Z" fill="#f5c86b" stroke="#d99a26" stroke-width="3" stroke-linejoin="round"/><circle cx="8" cy="22" r="6" fill="#ff7eb6"/><circle cx="50" cy="12" r="6" fill="#ff7eb6"/><circle cx="92" cy="22" r="6" fill="#ff7eb6"/></svg>'}
};
var $ = function(id){ return document.getElementById(id); };
var stageEl = $("stage"), namesEl = $("names");

var state = {
  ratio:"16:9", bg:0, music:false, duration:"auto",
  names:[
    {text:"Taiyang", font:"Parisienne", color:"#ff7eb6", size:1, thick:1, deco:"cat"},
    {text:"yueliang", font:"Parisienne", color:"#f5c86b", size:1, thick:1, deco:"paw"}
  ]
};
var playToken = 0, recording = false, recCanvas = null, recCtx = null, recorder = null, recChunks = [], recRAF = 0, recBusy = false;
var lastExportBlob = null;

/* ================= 字体 blob ================= */
var fontURLs = {};
function fontURL(name){
  if(!fontURLs[name]) fontURLs[name] = URL.createObjectURL(new Blob([JSON.stringify(FONTS[name])], {type:"application/json"}));
  return fontURLs[name];
}

/* ================= 界面搭建 ================= */
function buildControls(){
  ["font1","font2"].forEach(function(id, idx){
    var sel = $(id);
    Object.keys(FONTS_LABEL).forEach(function(k){
      var o = document.createElement("option"); o.value = k; o.textContent = FONTS_LABEL[k]; sel.appendChild(o);
    });
    sel.value = state.names[idx].font;
    sel.addEventListener("change", function(){ state.names[idx].font = sel.value; scheduleReplay(); });
  });
  [1,2].forEach(function(i){
    var box = $("color"+i);
    COLORS.forEach(function(c){
      var b = document.createElement("button");
      b.className = "sw" + (c.c==="#ffffff" ? " light" : "");
      b.style.background = c.c; b.title = c.n; b.dataset.color = c.c;
      if(state.names[i-1].color === c.c) b.classList.add("on");
      b.addEventListener("click", function(){
        state.names[i-1].color = c.c;
        box.querySelectorAll(".sw").forEach(function(x){ x.classList.toggle("on", x===b); });
        scheduleReplay();
      });
      box.appendChild(b);
    });
    var db = $("decoBtns"+i);
    Object.keys(DECOS).forEach(function(k){
      var b = document.createElement("button");
      b.className = "chip" + (state.names[i-1].deco===k ? " on" : "");
      b.textContent = DECOS[k].n; b.dataset.deco = k;
      b.addEventListener("click", function(){
        state.names[i-1].deco = k;
        db.querySelectorAll(".chip").forEach(function(x){ x.classList.toggle("on", x===b); });
        scheduleReplay();
      });
      db.appendChild(b);
    });
    $("name"+i).addEventListener("input", function(e){
      state.names[i-1].text = e.target.value;
      if(/[^\x00-\x7F]/.test(e.target.value)) setStatus("提示：手写字体只支持英文字母和数字，中文会显示成问号，建议用拼音。");
      else setStatus("");
      scheduleReplay();
    });
    $("size"+i).addEventListener("input", function(e){ state.names[i-1].size = parseFloat(e.target.value); scheduleReplay(); });
    $("thick"+i).addEventListener("input", function(e){ state.names[i-1].thick = parseFloat(e.target.value); scheduleReplay(); });
  });
  var bgBox = $("bgSwatches");
  BGS.forEach(function(bg, idx){
    var b = document.createElement("button");
    b.className = "sw"; b.style.background = "linear-gradient(135deg,"+bg.c1+","+bg.c2+")"; b.title = bg.n;
    if(idx===state.bg) b.classList.add("on");
    b.addEventListener("click", function(){
      state.bg = idx;
      bgBox.querySelectorAll(".sw").forEach(function(x){ x.classList.toggle("on", x===b); });
      applyBg(); drawStars(); scheduleReplay();
    });
    bgBox.appendChild(b);
  });
  document.querySelectorAll("[data-ratio]").forEach(function(b){
    b.addEventListener("click", function(){
      state.ratio = b.dataset.ratio;
      document.querySelectorAll("[data-ratio]").forEach(function(x){ x.classList.toggle("on", x===b); });
      stageEl.className = state.ratio==="9:16" ? "ratio-916" : state.ratio==="1:1" ? "ratio-11" : "";
      drawStars(); scheduleReplay();
    });
  });
  $("musicBtn").addEventListener("click", function(){
    state.music = !state.music;
    $("musicBtn").textContent = state.music ? "🎵 轻音乐：开" : "🎵 轻音乐：关";
    if(state.music) startMusic(); else stopMusic();
  });
  $("durationSel").addEventListener("change", function(e){ state.duration = e.target.value; });
  $("playBtn").addEventListener("click", function(){ play(); });
  $("replayBtn").addEventListener("click", function(){ play(); });
  $("exportBtn").addEventListener("click", exportVideo);
}
function setStatus(html){ $("status").innerHTML = html || ""; }

/* ================= 背景与星星 ================= */
function applyBg(){
  var bg = BGS[state.bg];
  stageEl.style.background = "linear-gradient(160deg,"+bg.c1+","+bg.c2+")";
  var light = !bg.stars;
  $("stageHint").style.color = light ? "rgba(0,0,0,.45)" : "rgba(255,255,255,.55)";
  $("doneTag").style.color = light ? "#b07f1e" : "#f5c86b";
}
function drawStars(){
  var cv = $("stars"), ctx = cv.getContext("2d");
  var w = stageEl.clientWidth, h = stageEl.clientHeight;
  cv.width = w; cv.height = h;
  ctx.clearRect(0,0,w,h);
  if(!BGS[state.bg].stars) return;
  var rnd = mulberry(42);
  for(var i=0;i<70;i++){
    var x = rnd()*w, y = rnd()*h, r = rnd()*1.4+0.3, a = rnd()*0.6+0.2;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle = "rgba(255,255,255,"+a.toFixed(2)+")"; ctx.fill();
  }
  for(var j=0;j<5;j++){ // 几颗亮星带光晕
    var x2 = rnd()*w, y2 = rnd()*h;
    var g = ctx.createRadialGradient(x2,y2,0,x2,y2,14);
    g.addColorStop(0,"rgba(255,240,200,.9)"); g.addColorStop(1,"rgba(255,240,200,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x2,y2,14,0,Math.PI*2); ctx.fill();
  }
}
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ================= 音乐（WebAudio 八音盒） ================= */
var audioCtx = null, musicGain = null, musicDest = null, musicTimer = null, musicStep = 0;
var MELODY = [72,0,76,0,79,0,76,0, 81,0,79,0,76,0,72,0, 74,0,77,0,81,0,77,0, 79,0,76,0,74,0,71,0];
function ensureAudio(){
  if(audioCtx) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  musicGain = audioCtx.createGain(); musicGain.gain.value = 0.16;
  musicGain.connect(audioCtx.destination);
  musicDest = audioCtx.createMediaStreamDestination();
  musicGain.connect(musicDest);
  // 低音铺底
  var pad = audioCtx.createOscillator(), pad2 = audioCtx.createOscillator(), pg = audioCtx.createGain();
  pad.type = "triangle"; pad.frequency.value = 130.81;
  pad2.type = "sine"; pad2.frequency.value = 196.00;
  pg.gain.value = 0.05; pad.connect(pg); pad2.connect(pg); pg.connect(musicGain);
  pad.start(); pad2.start();
}
function midiHz(m){ return 440*Math.pow(2,(m-69)/12); }
function pluck(midi){
  var t = audioCtx.currentTime;
  var o = audioCtx.createOscillator(), o2 = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = "sine"; o.frequency.value = midiHz(midi);
  o2.type = "triangle"; o2.frequency.value = midiHz(midi)*2;
  var g2 = audioCtx.createGain(); g2.gain.value = 0.25;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.9, t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t+1.4);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(musicGain);
  o.start(t); o2.start(t); o.stop(t+1.5); o2.stop(t+1.5);
}
function startMusic(){
  ensureAudio();
  if(audioCtx.state === "suspended") audioCtx.resume();
  if(musicTimer) return;
  musicTimer = setInterval(function(){
    var n = MELODY[musicStep % MELODY.length]; musicStep++;
    if(n) pluck(n);
  }, 300);
}
function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer = null; } }

/* ================= 纸屑 ================= */
var confettiParts = [], confettiRAF = 0;
function confettiBurst(){
  var cv = $("confetti"), ctx = cv.getContext("2d");
  cv.width = stageEl.clientWidth; cv.height = stageEl.clientHeight;
  var colors = [state.names[0].color, state.names[1].color, "#f5c86b", "#ff7eb6", "#ffffff", "#7ec8ff"];
  confettiParts = [];
  for(var i=0;i<180;i++){
    confettiParts.push({
      x: cv.width/2 + (Math.random()-0.5)*cv.width*0.5,
      y: cv.height*0.45 + (Math.random()-0.5)*40,
      vx:(Math.random()-0.5)*11, vy: -(Math.random()*9+3),
      s: Math.random()*7+4, r: Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3,
      c: colors[i%colors.length], round: Math.random()<0.4
    });
  }
  var frames = 0;
  cancelAnimationFrame(confettiRAF);
  (function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    var alive = false;
    confettiParts.forEach(function(p){
      p.vy += 0.28; p.vx *= 0.99; p.vy *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if(p.y < cv.height+20) alive = true;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if(p.round){ ctx.beginPath(); ctx.arc(0,0,p.s/2,0,Math.PI*2); ctx.fill(); }
      else ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.66);
      ctx.restore();
    });
    frames++;
    if(alive && frames < 400) confettiRAF = requestAnimationFrame(tick);
    else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ================= 播放 ================= */
function computeFontSize(i){
  var w = stageEl.clientWidth || 600;
  var base = w * 0.15 * state.names[i].size;
  return Math.max(26, Math.min(150, Math.round(base)));
}
function animDuration(text){ return Math.min(9000, 700 + (text||" ").length*520); }
var replayTimer = null;
function scheduleReplay(){ clearTimeout(replayTimer); replayTimer = setTimeout(function(){ play(); }, 450); }

function play(){
  var token = ++playToken;
  namesEl.classList.remove("fading");
  $("doneTag").classList.remove("show");
  $("stageHint").classList.add("hide");
  ["deco1","deco2"].forEach(function(id){ $(id).classList.remove("show"); });
  $("divider").classList.remove("show");
  cancelAnimationFrame(confettiRAF);
  var cc = $("confetti").getContext("2d"); cc.clearRect(0,0,$("confetti").width,$("confetti").height);
  var done = [false,false];
  state.names.forEach(function(n, i){
    var box = $("vara"+(i+1));
    box.innerHTML = "";
    var text = (n.text||"").trim() || " ";
    var v = new Vara("#vara"+(i+1), fontURL(n.font), [{
      text: text, fontSize: computeFontSize(i), strokeWidth: n.thick,
      color: n.color, duration: animDuration(text), textAlign: "center"
    }], {});
    v.animationEnd(function(){
      if(token !== playToken) return;
      var d = $("deco"+(i+1));
      d.innerHTML = DECOS[n.deco].svg;
      if(n.deco !== "none") d.classList.add("show");
      done[i] = true;
      if(done[0] && done[1]) outro(token);
    });
  });
  if(state.music) startMusic();
  setStatus("");
}
function outro(token){
  $("divider").classList.add("show");
  setTimeout(function(){ if(token===playToken) confettiBurst(); }, 500);
  setTimeout(function(){
    if(token!==playToken) return;
    namesEl.classList.add("fading");
    $("doneTag").classList.add("show");
    if(recording) setTimeout(stopRecording, 900);
  }, 2100);
}

/* ================= 导出视频 ================= */
function exportSize(){
  if(state.ratio==="9:16") return [720,1280];
  if(state.ratio==="1:1") return [720,720];
  return [1280,720];
}
var bitmapCache = new Map();
function svgBitmap(svgEl, w, h){
  var clone = svgEl.cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  clone.setAttribute("width", Math.max(2,Math.round(w)));
  clone.setAttribute("height", Math.max(2,Math.round(h)));
  var str = new XMLSerializer().serializeToString(clone);
  var cached = bitmapCache.get(svgEl);
  if(cached && cached.str === str) return Promise.resolve(cached.bmp);
  return createImageBitmap(new Blob([str], {type:"image/svg+xml"})).then(function(bmp){
    if(cached && cached.bmp) cached.bmp.close();
    bitmapCache.set(svgEl, {str:str, bmp:bmp});
    return bmp;
  });
}
function drawExportFrame(){
  if(!recording) return;
  var W = recCanvas.width, H = recCanvas.height;
  var scale = W / stageEl.clientWidth;
  var bg = BGS[state.bg];
  var g = recCtx.createLinearGradient(0,0,W*0.35,H);
  g.addColorStop(0,bg.c1); g.addColorStop(1,bg.c2);
  recCtx.fillStyle = g; recCtx.fillRect(0,0,W,H);
  recCtx.drawImage($("stars"), 0, 0, W, H);
  var stageRect = stageEl.getBoundingClientRect();
  function place(el){
    if(!el) return null;
    var r = el.getBoundingClientRect();
    return { x:(r.left-stageRect.left)*scale, y:(r.top-stageRect.top)*scale, w:r.width*scale, h:r.height*scale };
  }
  var jobs = [];
  [1,2].forEach(function(i){
    var svg = $("vara"+i).querySelector("svg");
    var p = place($("vara"+i));
    if(svg && p && p.w > 4 && p.h > 4){
      jobs.push(svgBitmap(svg, p.w, p.h).then(function(bmp){ recCtx.drawImage(bmp, p.x, p.y, p.w, p.h); }).catch(function(){}));
    }
    var deco = $("deco"+i);
    if(deco.classList.contains("show") && deco.querySelector("svg")){
      var dp = place(deco);
      if(dp) jobs.push(svgBitmap(deco.querySelector("svg"), dp.w, dp.h).then(function(bmp){ recCtx.drawImage(bmp, dp.x, dp.y, dp.w, dp.h); }).catch(function(){}));
    }
  });
  var div = $("divider");
  if(div.classList.contains("show")){
    var dv = place(div);
    if(dv){
      recCtx.fillStyle = state.names[0].color;
      recCtx.font = Math.round(dv.h*0.9)+"px serif";
      recCtx.textAlign = "center"; recCtx.textBaseline = "middle";
      recCtx.fillText("♥", dv.x+dv.w/2, dv.y+dv.h/2);
    }
  }
  recCtx.drawImage($("confetti"), 0, 0, W, H);
  Promise.all(jobs).catch(function(){});
}
function drawLoop(){
  if(!recording) return;
  drawExportFrame();
  recRAF = requestAnimationFrame(drawLoop);
}
function exportVideo(){
  if(recording){ setStatus("正在录制中，稍等一下…"); return; }
  if(!window.MediaRecorder){ setStatus("这个浏览器不支持录制，换 Chrome 试试。"); return; }
  var size = exportSize();
  recCanvas = document.createElement("canvas");
  recCanvas.width = size[0]; recCanvas.height = size[1];
  recCtx = recCanvas.getContext("2d");
  var stream = recCanvas.captureStream(30);
  var tracks = stream.getVideoTracks().slice();
  if(state.music && audioCtx && musicDest) tracks.push(musicDest.stream.getAudioTracks()[0]);
  var mime = ["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"].find(function(m){
    try{ return MediaRecorder.isTypeSupported(m); }catch(e){ return false; }
  }) || "";
  try{
    recorder = new MediaRecorder(new MediaStream(tracks), mime ? {mimeType:mime, videoBitsPerSecond:8000000} : undefined);
  }catch(e){ setStatus("录制启动失败："+e.message); return; }
  recChunks = [];
  recorder.ondataavailable = function(e){ if(e.data && e.data.size) recChunks.push(e.data); };
  recorder.onstop = function(){
    var blob = new Blob(recChunks, {type:"video/webm"});
    lastExportBlob = blob;
    var mb = (blob.size/1048576).toFixed(2);
    setStatus("已生成视频 <b>"+mb+" MB</b>（WebM，" + size[0] + "×" + size[1] + "），正在下载…");
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "动态签名-" + (state.names[0].text||"name") + "-" + (state.names[1].text||"name") + ".webm";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); }, 1000);
  };
  recording = true;
  $("exportBtn").disabled = true;
  recorder.start(200);
  drawLoop();
  play();
  setStatus("正在录制签名动画…");
  if(state.duration !== "auto"){
    setTimeout(function(){ if(recording) stopRecording(); }, parseInt(state.duration,10)*1000);
  }
}
function stopRecording(){
  if(!recording) return;
  recording = false;
  cancelAnimationFrame(recRAF);
  $("exportBtn").disabled = false;
  try{ if(recorder && recorder.state !== "inactive") recorder.stop(); }catch(e){}
}

/* ================= 启动 ================= */
buildControls();
applyBg();
window.addEventListener("resize", function(){ drawStars(); });
window.addEventListener("load", function(){ drawStars(); setTimeout(function(){ play(); }, 400); });
drawStars();
})();
</script>
