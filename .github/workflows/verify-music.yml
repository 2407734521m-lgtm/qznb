name: Verify music app

on:
  pull_request:
    branches: [main]
    paths:
      - "music/**"
      - ".gitmodules"
      - ".github/workflows/verify-music.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout including pinned Folia source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: music/folia/package-lock.json

      - name: Apply maintained Folia mobile gesture overlay
        run: node music/scripts/apply-folia-mobile-gestures.mjs

      - name: Apply optional Qianzhi account integration
        run: node music/scripts/apply-qianzhi-account.mjs

      - name: Apply first-run music provider login tour
        run: node music/scripts/apply-music-login-tour.mjs

      - name: Apply NetEase cross-device sync overlay
        run: node music/scripts/apply-folia-netease-sync.mjs

      - name: Test NetEase Worker security helpers
        run: node music/scripts/test-netease-security.mjs

      - name: Install Folia dependencies
        working-directory: music/folia
        run: npm ci

      - name: Install pinned Supabase browser client for the account overlay
        working-directory: music/folia
        run: npm install --no-save --package-lock=false --ignore-scripts @supabase/supabase-js@2.119.0

      - name: Apply Folia NetEase API Workers adapter
        run: node music/scripts/apply-folia-netease-workers.mjs

      - name: Test free music catalog Worker API
        run: node music/scripts/test-free-music-api.mjs

      - name: Apply free music catalog provider and license UI
        run: node music/scripts/apply-folia-free-catalog.mjs

      - name: Apply Folia mobile camera and empty-wall recovery
        run: node music/scripts/apply-folia-mobile-layout.mjs

      - name: Apply Help touch buttons for coarse pointers
        run: node music/scripts/apply-folia-help-touch-buttons.mjs

      - name: Apply playback start before lyrics
        run: node music/scripts/apply-folia-playback-start-before-lyrics.mjs

      - name: Apply online request timeouts
        run: node music/scripts/apply-folia-online-request-timeouts.mjs

      - name: Apply progress bar hit area
        run: node music/scripts/apply-folia-progress-bar-hit-area.mjs

      - name: Apply subtitle clearance for the expanded capsule
        run: node music/scripts/apply-folia-subtitle-clearance-expanded.mjs

      - name: Apply lyric timeline follow (shared resolver, scroll only when out of view)
        run: node music/scripts/apply-folia-lyrics-modal-follow.mjs

      - name: Apply lyric offset limits (global five seconds, per-song 50ms step, cloud lyrics)
        run: node music/scripts/apply-folia-lyrics-offsets.mjs

      - name: Apply lyric stage timing (stage offset, two-second recent line retention)
        run: node music/scripts/apply-folia-lyrics-stage-timing.mjs

      - name: Apply subtitle word-by-word reveal
        run: node music/scripts/apply-folia-lyrics-subtitle-words.mjs

      - name: Apply settings touch targets and search row actions
        run: node music/scripts/apply-folia-settings-touch-targets.mjs

      - name: Apply safe-area insets (viewport-fit, capsule, subtitle, settings sheet)
        run: node music/scripts/apply-folia-safe-area.mjs

      - name: Apply visualizer motion (opacity-only style switch, single capsule layout spring)
        run: node music/scripts/apply-folia-visualizer-motion.mjs

      - name: Apply subtitle fade on recent-line expiry
        run: node music/scripts/apply-folia-lyrics-subtitle-fade.mjs

      - name: Apply Qianzhi player polish (softer background dithering)
        run: node music/scripts/apply-folia-player-polish.mjs
      - name: Apply cover-following album-art background default
        run: node music/scripts/apply-folia-cover-following-background.mjs

      - name: Apply Qianzhi music brand label
        run: node music/scripts/apply-folia-qianzhi-label.mjs

      - name: Apply qianzhi product branding
        run: node music/scripts/apply-qianzhi-branding.mjs

      - name: Apply Qianzhi main-site music embed bridge
        run: node music/scripts/apply-qianzhi-embed-bridge.mjs

      - name: Apply RMS loudness fallback to the existing Folia analyser
        run: node music/scripts/apply-folia-audio-level.mjs

      - name: Apply Qianzhi batch 4 parallel prefetch
        run: node music/scripts/apply-folia-prefetch-parallel.mjs

      - name: Apply Qianzhi batch 4 NetEase anonymous warmup
        run: node music/scripts/apply-folia-netease-anon-warmup.mjs

      - name: Apply Qianzhi batch 4 visualizer bridge throttle
        run: node music/scripts/apply-folia-visualizer-bridge-throttle.mjs

      - name: Apply Qianzhi batch 4 cached copy verdict
        run: node music/scripts/apply-folia-cached-copy-verdict.mjs

      - name: Verify Qianzhi main-site music embed bridge
        run: node music/scripts/test-qianzhi-embed-bridge.mjs

      - name: Apply adaptive Qianzhi mobile performance profile
        run: node music/scripts/apply-qianzhi-performance.mjs

      - name: Typecheck Folia
        working-directory: music/folia
        run: npm run typecheck

      - name: Test Qianzhi album-art background default
        working-directory: music/folia
        run: npm run test:unit -- test/unit/visualizer/qianzhiDefaultCoverBackground.test.ts

      - name: Test Folia mobile camera and empty-wall recovery
        working-directory: music/folia
        run: npm run test:unit -- test/unit/library/bravais/bravaisMobileRecovery.test.ts

      - name: Test Lark mobile swipe integration
        working-directory: music/folia
        run: npm run test:unit -- test/unit/components/playerSwipe.test.ts

      - name: Test Qianzhi account integration
        working-directory: music/folia
        run: npm run test:unit -- test/unit/qianzhiAccount/loginMethod.test.ts

      - name: Test NetEase sync client
        working-directory: music/folia
        run: npm run test:unit -- test/unit/qianzhiNeteaseSync/syncClient.test.ts

      - name: Test adaptive Qianzhi performance profile
        working-directory: music/folia
        run: npm run test:unit -- test/unit/utils/qianzhiPerformance.test.ts

      - name: Test Qianzhi lyric follow, offsets and subtitle reveal
        working-directory: music/folia
        run: npm run test:unit -- test/unit/lyrics/lyricTimelineModalFollow.test.ts test/unit/lyrics/lyricTimelineOffsetStep.test.ts test/unit/visualizer/subtitleOverlay.test.ts test/unit/stores/globalLyricTimelineOffset.test.ts test/unit/onlineMusic/neteaseCloudLyricLimit.test.ts

      - name: Test Qianzhi batch 3 visualizer motion helpers
        working-directory: music/folia
        run: npm run test:unit -- test/unit/visualizer/latentSettled.test.ts test/unit/visualizer/softFocusOpacityOnly.test.ts

      - name: Test Qianzhi batch 4 playback performance
        working-directory: music/folia
        run: npm run test:unit -- test/unit/prefetchParallel.test.ts test/unit/onlineMusic/neteaseAnonWarmup.test.ts test/unit/visualizer/visualizerBandThrottle.test.ts test/unit/cache/audioLengthCategory.test.ts test/unit/onlinePlaybackCachedCopyVerdict.test.ts

      - name: Build Folia Web + Worker
        working-directory: music/folia
        env:
          VITE_QQ_API_BASE: /api/qq
          VITE_NETEASE_API_BASE: /api/netease
          VITE_QZNB_SUPABASE_URL: https://ldypnxxxgscibopgiaso.supabase.co
        run: npm run build

      - name: Validate isolated workers.dev preview Worker config
        run: npx --yes wrangler@4.120.0 deploy --dry-run --config music/wrangler.preview.jsonc

      - name: Validate production custom-domain Worker config
        run: npx --yes wrangler@4.120.0 deploy --dry-run --config music/wrangler.jsonc
