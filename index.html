<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="/mobile-polish.css" />
  <title>Class Memory · 我们的班级</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%2394664f'/%3E%3Ctext%20x='32'%20y='41'%20font-family='Arial,sans-serif'%20font-size='24'%20font-weight='700'%20text-anchor='middle'%20fill='%23ffffff'%3ECM%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <!-- Minimal SVG displacement filter adapted from the MIT-licensed
       dpawlikowski/liquid-glass project; consumed only by the private-chat CSS. -->
  <svg class="qz-chat-liquid-filter-defs" aria-hidden="true" focusable="false" width="0" height="0" xmlns="http://www.w3.org/2000/svg">
    <filter id="qz-chat-liquid-glass-filter" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="7" result="qzChatNoise" />
      <feDisplacementMap in="SourceGraphic" in2="qzChatNoise" scale="12" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
