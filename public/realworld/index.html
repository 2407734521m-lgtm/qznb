<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>真实世界 · REALWORLD VISION ENGINE</title>
<style>
  :root{
    --grn:#3dff6e; --grn-dim:rgba(61,255,110,.55); --grn-faint:rgba(61,255,110,.16);
    --amber:#ffb02e; --red:#ff3b30; --ink:#eaffef;
    --panel:rgba(3,14,7,.72); --line:rgba(61,255,110,.35);
    --mono:"SFMono-Regular",Consolas,"Roboto Mono","Courier New",monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000}
  body{font-family:var(--mono);color:var(--ink);font-size:13px;user-select:none;-webkit-user-select:none}
  #cam,#photo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #photo{object-fit:contain}
  #hud{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
  .vig{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}
  .scan{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:.05;
    background:repeating-linear-gradient(0deg,#0f0 0 1px,transparent 1px 3px)}

  /* ---------- top bar ---------- */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;
    align-items:flex-start;padding:calc(8px + env(safe-area-inset-top)) 12px 0;pointer-events:none}
  .tstat{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
    padding:5px 9px;border-radius:3px;backdrop-filter:blur(3px)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .tstat b{color:var(--grn);font-weight:600;letter-spacing:.5px}
  #clockbox{text-align:right;background:var(--panel);border:1px solid var(--line);padding:5px 9px;border-radius:3px}
  #clock{color:var(--ink);font-size:14px}
  #batt{color:var(--grn);font-size:11px;margin-top:1px}

  /* ---------- left stats ---------- */
  #stats{position:fixed;left:12px;top:19%;z-index:10;background:var(--panel);border:1px solid var(--line);
    border-radius:3px;padding:8px 10px;min-width:118px;pointer-events:none;backdrop-filter:blur(3px)}
  #stats .row{display:flex;justify-content:space-between;gap:12px;line-height:1.85}
  #stats .k{color:#9fd8ae}#stats .v{color:var(--grn);font-weight:600}
  #objcount{color:var(--grn);font-size:12px}

  /* ---------- lock panel ---------- */
  #lockbox{position:fixed;left:12px;bottom:118px;z-index:10;max-width:56vw;pointer-events:none}
  #lockbox .ttl{color:var(--grn);font-size:11px;letter-spacing:2px;margin-bottom:5px;text-shadow:0 1px 3px #000}
  .lockitem{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--grn);
    border-radius:3px;padding:5px 8px;margin-bottom:5px;line-height:1.5;backdrop-filter:blur(3px)}
  .lockitem .nm{color:#fff;font-size:12px}
  .lockitem .dt{color:var(--grn);font-size:11px}

  /* ---------- object stream ---------- */
  #stream{position:fixed;right:0;top:15%;bottom:110px;z-index:10;width:158px;display:flex;flex-direction:column;
    pointer-events:none}
  #stream .ttl{color:var(--grn);font-size:11px;letter-spacing:1px;text-align:right;padding-right:10px;margin-bottom:6px;
    text-shadow:0 1px 3px #000}
  #streamlist{overflow:hidden;display:flex;flex-direction:column;gap:5px;padding-right:6px}
  .sitem{background:linear-gradient(90deg,transparent,var(--panel) 25%);border-right:3px solid var(--grn);
    padding:5px 8px 5px 14px;text-align:right;line-height:1.45;border-radius:2px}
  .sitem.weak{border-right-color:var(--amber)}
  .sitem.lost{border-right-color:#666;opacity:.55}
  .sitem .id{color:#8affa5;font-size:11px}
  .sitem .cls{color:#fff;font-size:12px}
  .sitem .st{font-size:10px;color:var(--grn)}
  .sitem.weak .st{color:var(--amber)} .sitem.lost .st{color:#999}

  /* ---------- center reticle label ---------- */
  #centerlbl{position:fixed;left:50%;top:64%;transform:translateX(-50%);z-index:9;text-align:center;pointer-events:none}
  #centerlbl .t1{color:var(--ink);font-size:12px;letter-spacing:1px;text-shadow:0 1px 4px #000}
  #centerlbl .t2{color:var(--grn);font-size:12px;margin-top:2px;text-shadow:0 1px 4px #000}

  /* ---------- bottom nav ---------- */
  #navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
  .navbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 8px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);
    font-family:var(--mono);font-size:13px;cursor:pointer;backdrop-filter:blur(4px)}
  .navbtn:active{border-color:var(--grn);color:var(--grn)}
  .navbtn.on{border-color:var(--grn);color:var(--grn);box-shadow:0 0 12px var(--grn-faint) inset}
  .navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}

  /* ---------- boot ---------- */
  #boot{position:fixed;inset:0;z-index:50;background:#010603;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:28px;text-align:center}
  #boot .logo{font-size:44px;letter-spacing:8px;color:#fff;font-weight:700}
  #boot .logo span{color:var(--grn)}
  #boot .sub{color:var(--grn);letter-spacing:3px;font-size:12px;margin-top:6px}
  #boot .barwrap{width:min(420px,84vw);height:5px;background:#0a2a14;margin:34px 0 10px;border-radius:3px;overflow:hidden}
  #bootbar{height:100%;width:0%;background:var(--grn);transition:width .25s}
  #bootmsg{color:#9fd8ae;font-size:12px;min-height:18px}
  #bootfoot{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));color:#5d8268;font-size:11px;letter-spacing:1px;line-height:1.9}
  #startbtn{margin-top:26px;padding:13px 44px;background:transparent;border:1px solid var(--grn);color:var(--grn);
    font-family:var(--mono);font-size:15px;letter-spacing:4px;border-radius:4px;cursor:pointer;display:none}
  #startbtn:active{background:var(--grn-faint)}

  /* ---------- sheet (settings / messages) ---------- */
  #sheetmask{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#04140a;border-top:1px solid var(--grn);
    border-radius:12px 12px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));display:none;
    max-height:76vh;overflow-y:auto}
  #sheet h3{color:var(--grn);font-size:14px;letter-spacing:2px;margin-bottom:14px;font-weight:600}
  .srow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(61,255,110,.12)}
  .srow .lab{color:var(--ink);font-size:13px}
  .srow .hint{color:#7fae8c;font-size:11px;margin-top:2px}
  input[type=range]{width:150px;accent-color:var(--grn)}
  .switch{width:46px;height:26px;border-radius:13px;border:1px solid var(--grn);position:relative;cursor:pointer;flex:none}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
    background:#2a5c38;transition:all .15s}
  .switch.on::after{left:22px;background:var(--grn)}
  #sheet .bigbtn{width:100%;margin-top:16px;padding:12px;background:var(--grn-faint);border:1px solid var(--grn);
    color:var(--grn);font-family:var(--mono);font-size:14px;letter-spacing:2px;border-radius:6px;cursor:pointer}
  #msgtext{color:var(--ink);font-size:13px;line-height:1.8;white-space:pre-wrap}
  .note{color:#7fae8c;font-size:11px;line-height:1.7;margin-top:12px}
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<img id="photo" alt="" style="display:none">
<canvas id="hud"></canvas>
<div class="vig"></div>
<div class="scan"></div>

<div id="topbar">
  <div class="tstat"><span class="dot"></span><span>系统状态</span><b>NOMINAL</b></div>
  <div id="clockbox"><div id="clock">--:--:--</div><div id="batt">LOCAL INFERENCE · NO CLOUD</div></div>
</div>

<div id="stats">
  <div class="row"><span class="k">实时画面</span><span class="v" id="st_fps">— FPS</span></div>
  <div class="row"><span class="k">识别速率</span><span class="v" id="st_hz">— Hz</span></div>
  <div class="row"><span class="k">画面</span><span class="v" id="st_res">— × —</span></div>
  <div class="row"><span class="k">目标</span><span id="objcount">OBJECTS 0</span></div>
</div>

<div id="lockbox"><div class="ttl">▣ 目标锁定 TARGET LOCK</div><div id="locklist"></div></div>

<div id="stream"><div class="ttl">LIVE OBJECT STREAM</div><div id="streamlist"></div></div>

<div id="centerlbl"><div class="t1" id="ct1"></div><div class="t2" id="ct2"></div></div>

<div id="navbar">
  <button class="navbtn on" id="btn_live">
    <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5 21 7v10l-5.5-3.5"/></svg>
    <span id="btn_live_txt">实时拍摄</span>
  </button>
  <button class="navbtn" id="btn_gallery">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 19 10 13l3.5 3.5L17 13l3 3.5"/></svg>
    <span>图库导入</span>
  </button>
  <button class="navbtn" id="btn_settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>
    <span>设置</span>
  </button>
</div>
<input type="file" id="filepick" accept="image/*" style="display:none">

<div id="boot">
  <div class="logo">真实<span>世界</span></div>
  <div class="sub">REALWORLD · VISION ENGINE</div>
  <div class="barwrap"><div id="bootbar"></div></div>
  <div id="bootmsg">正在初始化…</div>
  <button id="startbtn">进 入</button>
  <div id="bootfoot">LOCAL INFERENCE · NO CLOUD<br>本地推理 · 数据不出设备</div>
</div>

<div id="sheetmask"></div>
<div id="sheet"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
