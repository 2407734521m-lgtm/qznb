name: Verify pull request
on:
  push:
    branches: ['feat/admin-workspace-*', 'feat/admin-console-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: bash scripts/gen-types.test.sh
      - run: npm run check:styles
      - run: npm run check:admin-styles
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/email-dispatch/index.ts
          deno check supabase/functions/friend-request-email/index.ts
          deno check supabase/functions/admin-bulk-email/index.ts
          deno check supabase/functions/maintenance-notify/index.ts
          deno check supabase/functions/dev-feedback/index.ts
          deno check supabase/functions/location-reverse-geocode/index.ts
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
